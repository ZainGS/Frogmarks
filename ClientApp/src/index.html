<!DOCTYPE html>
<html lang="en" style="background:#080808">
  <head>
    <meta charset="utf-8" />
    <!-- First: the relative icon / manifest URLs below resolve against it on deep links (/illustration/local/…). -->
    <base href="/" />
    <title>Frogmarks</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
    <link rel="icon" type="image/x-icon" href="assets/favicon/favicon.ico" />
    <!-- Installable app (docs: salsa/docs/ui/pwa.md). theme-color = the manifest's theme_color / background_color =
         the root background on <html> above (#080808), so the splash, the title / status bar and the first paint match. -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#080808">

    <!-- interactive-widget=resizes-visual: the on-screen keyboard overlays the page instead of shrinking the layout
         viewport (which would resize the WebGPU canvas + reflow the editor every time it opens). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-visual" />

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sixtyfour+Convergence:BLED,SCAN,XELA,YELA@0..100,-53..100,-100..100,-100..100&display=swap">

    <style>
      body {
        user-select: none;         /* modern browsers */
        -webkit-user-select: none; /* Safari/Chrome */
        -moz-user-select: none;    /* Firefox */
        -ms-user-select: none;     /* old IE/Edge */
      }
    </style>
  </head>
  <body class="base-body theme-retro-chrome">
    <script>
      // View › Retro Chrome is on by default; localStorage fm-theme = 'plain' turns it off. Applied here, before the
      // app boots, so the wrong theme never flashes. Same key / value as src/app/shared/services/theme/retro-theme.ts.
      try { if (localStorage.getItem('fm-theme') === 'plain') document.body.classList.remove('theme-retro-chrome'); } catch (e) {}
    </script>
    <script>
      document.addEventListener("contextmenu", function (e) {
        e.preventDefault(); // suppress native browser menu (Angular custom menus still fire)
      });
    </script>
    <app-root></app-root>
  </body>
</html>
