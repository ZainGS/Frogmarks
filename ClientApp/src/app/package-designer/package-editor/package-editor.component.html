<div class="pkg-shell dark-mode">

  <!-- Loading overlay -->
  <div class="pkg-loading" *ngIf="isLoading">
    <div class="pkg-loading-label">Loading…</div>
  </div>

  <!-- Header -->
  <header class="pkg-header">
    <button class="pkg-back-btn" (click)="goBack()">← Back</button>
    <span class="pkg-title">{{ projectName }}</span>
    <button class="pkg-export-btn" (click)="exportDielinePng()">Export PNG</button>
  </header>

  <div class="pkg-body">

    <!-- Left sidebar -->
    <aside class="pkg-sidebar">

      <section class="pkg-section">
        <div class="pkg-section-label">Box Dimensions (mm)</div>

        <label class="pkg-row">
          <span class="pkg-row-label">Width</span>
          <input type="range" min="20" max="400" step="1" [(ngModel)]="boxWidth" (change)="onDimensionChanged()">
          <input type="number" class="pkg-num" min="20" max="400" [(ngModel)]="boxWidth" (change)="onDimensionChanged()">
        </label>

        <label class="pkg-row">
          <span class="pkg-row-label">Height</span>
          <input type="range" min="20" max="400" step="1" [(ngModel)]="boxHeight" (change)="onDimensionChanged()">
          <input type="number" class="pkg-num" min="20" max="400" [(ngModel)]="boxHeight" (change)="onDimensionChanged()">
        </label>

        <label class="pkg-row">
          <span class="pkg-row-label">Depth</span>
          <input type="range" min="10" max="300" step="1" [(ngModel)]="boxDepth" (change)="onDimensionChanged()">
          <input type="number" class="pkg-num" min="10" max="300" [(ngModel)]="boxDepth" (change)="onDimensionChanged()">
        </label>

        <label class="pkg-row">
          <span class="pkg-row-label">Bleed</span>
          <input type="range" min="0" max="10" step="0.5" [(ngModel)]="bleed" (change)="onDimensionChanged()">
          <input type="number" class="pkg-num" min="0" max="10" step="0.5" [(ngModel)]="bleed" (change)="onDimensionChanged()">
        </label>
      </section>

      <section class="pkg-section">
        <div class="pkg-section-label">Fold Preview</div>

        <div class="pkg-btn-row">
          <button class="pkg-btn" (click)="unfold()" title="Animate flat (dieline view)">Unfold</button>
          <button class="pkg-btn" (click)="fold()"   title="Animate to closed box">Fold</button>
        </div>

        <label class="pkg-row">
          <span class="pkg-row-label">Scrub</span>
          <input type="range" min="0" max="1" step="0.01" [(ngModel)]="foldAmount" (input)="onFoldChanged()">
          <span class="pkg-val">{{ foldAmount | number:'1.2-2' }}</span>
        </label>
      </section>

      <!-- Guides section: re-enable when the flat dieline pane is added -->
      <!-- <section class="pkg-section">...</section> -->

    </aside>

    <!-- Canvas area -->
    <div class="pkg-canvas-area">
      <canvas #webgpuCanvas id="webgpuCanvas"></canvas>
      <!-- Guide canvas hidden until the flat dieline pane is built; guides belong there, not over the 3D box -->
      <canvas #guideCanvas class="pkg-guide-canvas" style="display:none"></canvas>
    </div>

  </div>
</div>
