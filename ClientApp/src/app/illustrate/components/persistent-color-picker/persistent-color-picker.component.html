<!-- Main picker: hue ring + swatch -->
<div class="picker-main">
    <!-- pointermove on the ring / square is listened outside the zone (PersistentColorPickerComponent.ngAfterViewInit) -->
    <div class="hue-ring" #hueRing
         (pointerdown)="onHueRingPointerDown($event)"
         (pointerup)="onPickerPointerEnd()"
         (pointercancel)="onPickerPointerEnd()"
         (lostpointercapture)="onPickerPointerEnd()">
        <div class="hue-ring-thumb" #hueThumb
             [style.transform]="'rotate(' + persistentHue + 'deg) translateY(-63px)'">
        </div>
        <!-- SB square inside the ring -->
        <div class="sb-square" #sbSquare
             [style.background]="'linear-gradient(to top, #000, transparent), linear-gradient(to right, #fff, hsl(' + persistentHue + ', 100%, 50%))'"
             (pointerdown)="onSbSquarePointerDown($event)">
            <div class="sb-indicator" #sbIndicator
                 [style.left.%]="persistentSbX"
                 [style.top.%]="persistentSbY">
            </div>
        </div>
    </div>
    <!-- Current color swatch -->
    <div class="persistent-swatch-row">
        <div class="persistent-swatch" [style.background-color]="color"></div>
        <!-- [value] + (input), not ngModel: NgModel writes each new [ngModel] through a resolved promise, i.e. a second
             app change detection per picked colour (a ring / square drag ran 2 ticks per frame). -->
        <input type="text" class="persistent-hex-input"
               [value]="color"
               (input)="onPersistentHexInput($any($event.target).value)">
        <input type="number" class="persistent-opacity-input"
               min="0" max="100" step="1"
               [value]="persistentOpacity"
               (change)="onPersistentOpacityChange($event)"
               title="Opacity">
        <span class="persistent-opacity-pct">%</span>
    </div>
</div>
<!-- Recent colors — vertical strip on the right -->
<div class="recent-colors-row">
    <ng-container *ngFor="let i of [0,1,2,3,4,5,6]">
        <ng-container *ngIf="recentColors[i] as c; else colorPlaceholder">
            <div class="recent-color-dot"
                 [style.background-color]="c"
                 [class.recent-color-dot--active]="c === color"
                 (click)="pickRecent.emit(c)"
                 [title]="c"></div>
        </ng-container>
        <ng-template #colorPlaceholder>
            <div class="recent-color-dot recent-color-dot--placeholder"></div>
        </ng-template>
    </ng-container>
</div>
<!-- Utility actions column -->
<div class="picker-actions">
    <!-- Foreground / secondary swap -->
    <div class="picker-swap" (click)="swap.emit()" title="Swap primary ↔ secondary color">
        <div class="swap-bg-square" [style.background]="secondaryColor"></div>
        <div class="swap-fg-square" [style.background]="color"></div>
        <span class="swap-icon">↺</span>
    </div>
    <!-- Reset to black/white -->
    <button class="picker-action-btn" (click)="resetColors.emit()" title="Reset to black / white">
        <span class="reset-icon">
            <span class="reset-white"></span>
            <span class="reset-black"></span>
        </span>
    </button>
    <!-- Palettes: opens / closes the palettes popup (stays open while painting; Esc closes it) -->
    <button type="button" class="picker-action-btn picker-palettes" [class.on]="palettesOpen"
            [attr.aria-expanded]="palettesOpen"
            (click)="togglePalettes()"
            title="Palettes" aria-label="Palettes">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="square" aria-hidden="true">
            <path d="M3 3h8v8H3zM13 3h8v8h-8zM3 13h8v8H3zM13 13h8v8h-8z"/>
        </svg>
    </button>
    <!-- Eyedropper: arms a one-shot sample — the next tap / click on the canvas picks its colour (Alt+click also
         samples on desktop). Tap again to disarm. -->
    <button type="button" class="picker-action-btn picker-eyedropper" [class.on]="eyedropperArmed"
            [attr.aria-pressed]="eyedropperArmed"
            (click)="eyedropper.emit()"
            title="Eyedropper — tap the canvas to pick its colour (Alt+click on desktop)"
            aria-label="Eyedropper: pick a colour from the canvas">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="square" aria-hidden="true">
            <path d="M14.5 4.5l5 5M17 2l5 5-3 3-5-5zM13 8l-9 9v3h3l9-9"/>
        </svg>
    </button>
</div>
<!-- Palettes popup (position: fixed, placed above the picker by _placePalettesPopup). Tap an empty square: it takes the
     picker colour and stays linked (the selected square follows the picker); tap a filled one: the picker takes its
     colour; long-press / double-tap a filled one: linked again. + adds a row below, ✕ deletes the row (Undo toast). -->
<div *ngIf="palettesOpen" #palettesPopup class="palettes-popup" role="dialog" aria-label="Palettes"
     (pointerdown)="$event.stopPropagation()"
     (contextmenu)="$event.preventDefault()">
    <div class="palette-row" *ngFor="let row of palettes.rows; let r = index">
        <div *ngFor="let c of row; let col = index; trackBy: trackByIndex"
             class="palette-square"
             [class.palette-square--empty]="!c"
             [class.palette-square--selected]="palettes.isSelected(r, col)"
             [style.background-color]="c"
             [attr.title]="c"
             (pointerdown)="onSquarePointerDown($event, r, col)"
             (pointerup)="onSquarePointerUp()"
             (pointercancel)="onSquarePointerCancel()"></div>
        <button type="button" class="palette-row-btn" (click)="addPaletteRow(r)"
                title="Add a row below" aria-label="Add a row below">+</button>
        <button type="button" class="palette-row-btn" (click)="deletePaletteRow(r)"
                title="Delete this row" aria-label="Delete this row">✕</button>
    </div>
</div>
