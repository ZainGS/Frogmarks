<!-- Round-2 feedback (2026-10-08): no header bar or tool strip — the main toolbar's Select / Pan / Move / Rotate / Scale
     stay, the mode's tools are in the right panel. The pill is always up: Frame, then the active tool's name +
     parameters + Apply (no Cancel: tapping the tool again turns it off; Esc still cancels). -->
<app-mode-op-pill *ngIf="op as o" [class.above-timeline]="ed.animationEnabled"
    [title]="o.title" [params]="o.params" [showApplyCancel]="o.showApplyCancel" [showCancel]="false"
    [showFrame]="true" (frame)="frame()"
    [applyLabel]="o.applyLabel" [applyDisabled]="o.applyDisabled"
    (paramChange)="setOpParam($event)" (apply)="applyOp()" (cancel)="cancelOp()" (action)="opAction($event)"></app-mode-op-pill>

<app-mode-props-panel class="mep-props" [class.above-timeline]="ed.animationEnabled">
    <app-mesh-edit-props [ed]="ed"></app-mesh-edit-props>
</app-mode-props-panel>

<app-mode-radial-menu [open]="radial.open" [x]="radial.x" [y]="radial.y" [items]="radial.items" [title]="radial.title"
    (pick)="runRadial($event)" (closed)="closeRadial()"></app-mode-radial-menu>
