<div class="uv-panel">

  <!-- Header -->
  <div class="uv-header">
    <button class="uv-exit-btn" (click)="close()">&#8592; Close</button>
    <span class="uv-title">UV Editor</span>
  </div>

  <div class="uv-body">

    <!-- ── Display ─────────────────────────────────────────────── -->
    <!-- 2026-10-08: the only section left (the brush moved to the left tool sub-panel, Stamp decal + Export are
         hidden), so no collapsible title: the panel is just these three toggles and sizes to them. -->
    <div class="uv-section">
      <label class="uv-check-row"><input type="checkbox" [checked]="showWireframe" (change)="toggleWireframe()"> Wireframe</label>
      <label class="uv-check-row"><input type="checkbox" [checked]="showIslands"   (change)="toggleIslands()">   Islands</label>
      <label class="uv-check-row"><input type="checkbox" [checked]="showUVPane"    (change)="toggleUVPane()">    Show UV Pane</label>
    </div>

<!-- ── Tools ───────────────────────────────────────────────────── -->
    <!-- Hidden 2026-10-08 (showStampDecal): Brush is always the mode; the stamp code stays for when it comes back. -->
    <div class="uv-section" *ngIf="showStampDecal">
      <div style="display:flex;gap:4px;padding-bottom:6px;">
        <button class="uv-btn" style="flex:1"
                [class.uv-btn-active]="activeTool==='brush'"
                (click)="setTool('brush')">Brush</button>
        <button class="uv-btn" style="flex:1"
                [class.uv-btn-active]="activeTool==='stamp'"
                (click)="setTool('stamp')">Stamp decal</button>
      </div>
      <ng-container *ngIf="activeTool==='stamp'">
        <div class="uv-field-row" style="margin-bottom:4px">
          <span class="uv-label">Size</span>
          <input type="range" min="0.05" max="1" step="0.01" style="flex:1"
                 [(ngModel)]="stampSize" (ngModelChange)="updateStampParams()">
          <span style="min-width:34px;text-align:right">{{ stampSize | number:'1.2-2' }}</span>
        </div>
        <div class="uv-field-row" style="margin-bottom:6px">
          <span class="uv-label">Rotation</span>
          <input type="range" min="-180" max="180" step="1" style="flex:1"
                 [(ngModel)]="stampRotationDeg" (ngModelChange)="updateStampParams()">
          <span style="min-width:34px;text-align:right">{{ stampRotationDeg }}°</span>
        </div>
        <div style="font-size:10px;opacity:0.55;padding-bottom:2px">
          Click in the 3D view to stamp. Source = active Decal panel selection.
        </div>
      </ng-container>
    </div>

<!-- ── Brush ───────────────────────────────────────────────────── -->
    <!-- 2026-10-08: the brush panel is no longer here — the editor shows <app-brush-options> in the left tool sub-panel
         (where 2D raster painting shows it) while UV Paint is open; the same RasterBrushService drives both. -->

    <!-- ── Save as GARP skin variant (Bridge 2: UV Paint → Skins) ─ -->
    <div class="uv-section" *ngIf="garpTarget">
      <div class="uv-section-title">Save as {{ garpTarget.poolName }} variant</div>
      <div class="uv-field-row" style="margin-bottom:6px">
        <span class="uv-label">Name</span>
        <input type="text" class="uv-select" [(ngModel)]="garpSkinName"
               placeholder="e.g. coke" style="flex:1;min-width:0">
      </div>
      <div style="display:flex;gap:4px">
        <button class="uv-btn" style="flex:1" [disabled]="!garpSkinName.trim() || garpSaving"
                (click)="garpSave()">
          {{ garpSaving ? 'Saving…' : 'Save variant' }}
        </button>
        <button class="uv-btn" style="flex:1" (click)="garpCancel()">Cancel</button>
      </div>
    </div>

    <!-- ── Export ────────────────────────────────────────────────── -->
    <!-- Hidden 2026-10-08 (showExportSection): the panel is the three Display toggles only. -->
    <div class="uv-section" *ngIf="showExportSection">
      <div class="uv-section-title uv-section-toggle" (click)="exportCollapsed = !exportCollapsed">
        <span class="uv-chevron">{{ exportCollapsed ? '▸' : '▾' }}</span>Export
      </div>
      <ng-container *ngIf="!exportCollapsed">
        <div class="uv-field-row" style="margin-bottom:6px">
          <span class="uv-label">Size</span>
          <select class="uv-select" [(ngModel)]="exportSize">
            <option [ngValue]="512">512</option>
            <option [ngValue]="1024">1024</option>
            <option [ngValue]="2048">2048</option>
            <option [ngValue]="4096">4096</option>
          </select>
        </div>
        <button class="uv-btn uv-btn-full" (click)="exportLayout()">Export UV Layout</button>
      </ng-container>
    </div>

  </div><!-- /uv-body -->

</div>
