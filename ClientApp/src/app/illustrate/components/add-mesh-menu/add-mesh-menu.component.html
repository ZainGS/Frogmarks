<button class="scene3d-btn scene3d-add-mesh-btn"
        (click)="menuOpenChange.emit(!menuOpen)">+ Add Mesh ▾</button>
<div *ngIf="menuOpen" class="scene3d-add-mesh-dropdown">
    <div class="scene3d-add-mesh-item" (click)="add.scene3dAddMesh('box'); menuOpenChange.emit(false)">Box</div>
    <div class="scene3d-add-mesh-item" (click)="add.scene3dAddMesh('sphere'); menuOpenChange.emit(false)">Sphere</div>
    <div class="scene3d-add-mesh-item" (click)="add.scene3dAddMesh('plane'); menuOpenChange.emit(false)">Plane</div>
    <div class="scene3d-add-mesh-item" (click)="add.scene3dAddCylinder(); menuOpenChange.emit(false)"
         title="Cylinder, cone, or tapered frustum">Cylinder…</div>
    <div class="scene3d-add-mesh-item" (click)="add.scene3dAddMesh('torus'); menuOpenChange.emit(false)">Torus</div>
    <div class="scene3d-add-mesh-item" (click)="add.scene3dAddMesh('sprite'); menuOpenChange.emit(false)" title="Flat textured quad — apply a texture to show an image">Sprite</div>
    <div class="scene3d-add-mesh-item" (click)="add.scene3dStartPolygonDraw(); menuOpenChange.emit(false)"
         title="Draw an outline on the view, extruded into an editable polygon">Polygon…</div>
    <div class="scene3d-add-mesh-item" (click)="add.scene3dAddCircle(); menuOpenChange.emit(false)"
         title="Circle: a flat n-gon (one face), like Blender's Circle">Circle…</div>
    <div class="scene3d-add-mesh-item" (click)="add.scene3dAddRevolve(); menuOpenChange.emit(false)"
         title="Revolve a profile around the Y axis — vases, bottles, columns">Revolve…</div>
    <div class="scene3d-add-mesh-item" (click)="add.scene3dAddTube(); menuOpenChange.emit(false)"
         title="Tube along a path — pipes, horns, branches, cables">Tube…</div>
    <div class="scene3d-add-mesh-item" (click)="add.scene3dAddMetaball(); menuOpenChange.emit(false)"
         title="Smooth-fused SDF blobs — organic shapes, slime, coral, clouds">Metaballs…</div>
    <div class="scene3d-add-mesh-item" (click)="add.scene3dAddCreature(); menuOpenChange.emit(false)"
         title="Parametric animal — dog, cat, horse, lizard, bird">Creature…</div>
    <div class="scene3d-add-mesh-item" (click)="action.emit('group'); menuOpenChange.emit(false)">Group</div>
    <div class="scene3d-add-mesh-item" (click)="action.emit('ribbon'); menuOpenChange.emit(false)"
         title="Ribbon — flat strip for banners/scrolling text">Ribbon</div>
    <div class="scene3d-add-mesh-item" (click)="add.scene3dAddCloth(); menuOpenChange.emit(false)"
         title="Cloth — GPU-simulated fabric mesh">Cloth…</div>
    <div class="scene3d-add-mesh-item" (click)="add.scene3dAddParticles(); menuOpenChange.emit(false)">Particles…</div>
    <div class="scene3d-add-mesh-item" (click)="add.scene3dAddCharacter(); menuOpenChange.emit(false)"
         title="Generate a rigged procedural character body">Character…</div>
    <div class="scene3d-add-mesh-item" (click)="action.emit('building'); menuOpenChange.emit(false)"
         title="Generate a procedural building">Building…</div>
    <div *ngIf="exp.cityMeshes" class="scene3d-add-mesh-item" (click)="action.emit('foliage'); menuOpenChange.emit(false)"
         title="Generate a freestanding plant or hedge">Foliage…</div>
    <div *ngFor="let ct of extraCreatorTypes"
         class="scene3d-add-mesh-item"
         (click)="action.emit({ creator: ct.typeId }); menuOpenChange.emit(false)"
         title="Add a procedural {{ ct.label }}">{{ ct.label }}…</div>
    <div *ngIf="exp.cityMeshes" class="scene3d-add-mesh-item" (click)="action.emit('block'); menuOpenChange.emit(false)"
         title="Create a neighborhood block (many buildings as one instanced unit)">Block…</div>
    <div *ngIf="exp.cityMeshes" class="scene3d-add-mesh-item" (click)="action.emit('package'); menuOpenChange.emit(false)"
         title="Add a foldable 3D box package">Package…</div>
    <div class="scene3d-add-mesh-item" (click)="action.emit('camera'); menuOpenChange.emit(false)"
         title="Add a cinematic camera node — place, look-through, and set cuts in the timeline">Camera</div>
    <div class="scene3d-add-mesh-item" (click)="action.emit('cdKit'); menuOpenChange.emit(false)"
         title="Add a CD jewel-case kit — front insert, tray card, disc, and booklet">CD Kit</div>
</div>
