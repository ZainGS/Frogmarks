<ng-container *ngIf="chromeVisible">
  <!-- Bottom pill: Frame + the active tool's parameters (no Cancel: turning the tool off replaces it) -->
  <app-mode-op-pill *ngIf="opPill as op" [class.above-timeline]="aboveTimeline"
      [title]="op.title" [params]="op.params" [showApplyCancel]="op.showApplyCancel" [showCancel]="false"
      [applyLabel]="op.applyLabel || 'Apply'" [showFrame]="true" (frame)="frame()"
      (paramChange)="onParamChange($event)" (apply)="onOpApply()" (cancel)="onOpCancel()" (action)="onOpAction($event)"></app-mode-op-pill>

  <app-mode-props-panel class="arm-props" [class.above-timeline]="aboveTimeline">
    <app-arm-sections class="arm-body">
      <!-- Top: Rig | Animate, then the selection-type switch + Deselect all, then the mode tools -->
      <div class="ar-section arm-top">
        <div class="ar-btn-pair" role="group" aria-label="Workspace">
          <button *ngFor="let w of workspaces" type="button" class="ar-op-btn" [class.ar-active]="workspace === w.id"
                  [attr.aria-pressed]="workspace === w.id" [title]="w.title" (click)="setWorkspace(w.id)">{{ w.label }}</button>
        </div>
        <div class="ar-btn-pair arm-seg-row">
          <ng-container *ngIf="workspace === 'rig'">
            <button *ngFor="let s of segments" type="button" class="ar-op-btn" [class.ar-active]="segment === s.id"
                    [attr.aria-pressed]="segment === s.id" [title]="s.label + (s.key ? ' (' + s.key + ')' : '')"
                    (click)="setSegment(s.id)">{{ s.label }}</button>
          </ng-container>
          <button type="button" class="ar-op-btn ar-op-xs ar-op-ghost arm-deselect" [disabled]="!hasSelection"
                  (click)="deselectAll()">Deselect all</button>
        </div>
        <div class="arm-tools" role="toolbar" aria-label="Armature tools">
          <div *ngFor="let t of modeTools; trackBy: trackTool" class="arm-tool">
            <div class="vertical-tool-button" role="button" tabindex="0"
                 [class.selected]="tool === t.id" [attr.aria-pressed]="tool === t.id" [attr.aria-label]="t.label"
                 [attr.data-id]="t.id" [title]="t.label + (t.key ? ' (' + t.key + ')' : '')"
                 (click)="toggleModeTool(t.id)" (keydown.enter)="toggleModeTool(t.id)" (keydown.space)="$event.preventDefault(); toggleModeTool(t.id)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#e8e8e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path *ngFor="let d of t.paths" [attr.d]="d"/>
              </svg>
            </div>
            <span class="tool-name" aria-hidden="true" [title]="t.label" (click)="toggleModeTool(t.id)">{{ shortToolLabel(t) }}</span>
          </div>
        </div>
      </div>

      <ng-container *ngIf="workspace === 'rig'; else animateProps">
        <app-arm-skeletons-section></app-arm-skeletons-section>
        <app-arm-joints-section [showAddBone]="false"></app-arm-joints-section>
        <ng-container *ngIf="!rig.jointsCollapsed">
          <app-arm-joint-props-section [chrome]="true" [selectionCount]="session.selection.length"></app-arm-joint-props-section>
          <app-arm-constraints-section></app-arm-constraints-section>
        </ng-container>
        <app-arm-bind-section></app-arm-bind-section>
        <app-arm-weight-section [chrome]="true" (paint)="onWeightPaint($event)"></app-arm-weight-section>
        <app-arm-spring-section></app-arm-spring-section>
      </ng-container>

      <ng-template #animateProps>
        <app-arm-poses-section></app-arm-poses-section>
        <app-arm-pose-library-section></app-arm-pose-library-section>
        <app-arm-clips-section></app-arm-clips-section>
        <app-arm-nla-section></app-arm-nla-section>
        <app-arm-libraries-section></app-arm-libraries-section>
        <app-arm-retarget-section></app-arm-retarget-section>
      </ng-template>

      <div class="ar-form-row arm-bg-row">
        <span class="ar-label">Background</span>
        <select class="ar-select" [value]="bgMode" (change)="setBgMode($any($event.target).value)" aria-label="Background">
          <option *ngFor="let b of bgModes" [value]="b.id" [selected]="b.id === bgMode">{{ b.label }}</option>
        </select>
      </div>
    </app-arm-sections>
  </app-mode-props-panel>

  <app-mode-radial-menu [open]="radial.open" [x]="radial.x" [y]="radial.y" [items]="radial.items" [title]="radial.title"
      (pick)="runRadial($event)" (closed)="closeRadial()"></app-mode-radial-menu>
</ng-container>
