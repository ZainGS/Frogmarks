<div class="ar-panel">

  <!-- Header -->
  <div class="ar-header">
    <button class="ar-exit-btn" (click)="close()">&#8592; Close</button>
    <span class="ar-title">Armature</span>
    <select class="ar-bg-select" [(ngModel)]="bgMode" (change)="updateBgMode()"
            title="Background style">
      <option *ngFor="let b of bgModes" [value]="b.id">{{ b.label }}</option>
    </select>
    <button class="ar-refresh-btn" (click)="refreshAll()" title="Refresh">↺</button>
  </div>

  <app-arm-sections class="ar-body">

    <!-- ── Placement mode banner ───────────────────────────── -->
    <div *ngIf="rig.placementModeActive" class="ar-placement-banner">
      <span>📍 {{ rig.placementHint }}</span>
      <button class="ar-op-btn ar-op-xs ar-op-ghost" (click)="rig.cancelPlacement()">Cancel</button>
    </div>

    <app-arm-skeletons-section></app-arm-skeletons-section>

    <!-- ── Tool mode toggle (above Joints) ─────────────────── -->
    <div *ngIf="rig.activeSkeleton" class="ar-btn-pair" style="margin-bottom:8px">
      <button class="ar-op-btn" style="flex:1"
              [class.ar-active]="rig.armatureToolMode === 'rotate'"
              (click)="rig.setToolMode('rotate')">Rotate</button>
      <button class="ar-op-btn" style="flex:1"
              [class.ar-active]="rig.armatureToolMode === 'move'"
              (click)="rig.setToolMode('move')">Move</button>
    </div>

    <app-arm-joints-section></app-arm-joints-section>
    <ng-container *ngIf="!rig.jointsCollapsed">
      <app-arm-joint-props-section></app-arm-joint-props-section>
      <app-arm-constraints-section></app-arm-constraints-section>
    </ng-container>
    <app-arm-poses-section></app-arm-poses-section>
    <app-arm-bind-section></app-arm-bind-section>
    <app-arm-weight-section></app-arm-weight-section>
    <app-arm-clips-section></app-arm-clips-section>
    <app-arm-pose-library-section></app-arm-pose-library-section>
    <app-arm-libraries-section></app-arm-libraries-section>
    <app-arm-nla-section></app-arm-nla-section>
    <app-arm-retarget-section></app-arm-retarget-section>
    <app-arm-spring-section></app-arm-spring-section>

  </app-arm-sections><!-- /ar-body -->

</div>
