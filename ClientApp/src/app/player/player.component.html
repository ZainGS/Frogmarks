<div class="player-shell"
     (dragenter)="!isLoaded && onDragEnter($event)"
     (dragover)="!isLoaded && onDragOver($event)"
     (dragleave)="!isLoaded && onDragLeave($event)"
     (drop)="!isLoaded && onDrop($event)">

  <!-- Canvas (always mounted so WebGPU has a target; absolutely placed, so while hidden it doesn't push the drop zone
       off-screen) -->
  <canvas #webgpuCanvas id="playerCanvas" class="player-canvas" [class.hidden]="!isLoaded"
          [class.player-canvas--reveal]="fromShell && isLoaded"></canvas>

  <!-- Header bar (shown when a cart is loaded) -->
  <div class="player-header" *ngIf="isLoaded">
    <span class="player-header-title">{{ cartTitle }}</span>
    <span class="player-header-author" *ngIf="cartAuthor">by {{ cartAuthor }}</span>
    <button type="button" class="player-btn player-exit-btn" (click)="goHome()" title="Exit the player">✕ Exit</button>
  </div>

  <!-- Back (before a cart is loaded): an installed, full-screen app has no browser Back button -->
  <!-- (hidden while a cart launched from the Shell loads: that screen stays the launch's black until the cart fades in) -->
  <button type="button" class="player-btn player-back-btn" *ngIf="!isLoaded && !(fromShell && isLoading && !spinnerVisible)" (click)="goHome()" title="Back to Frogmarks">← Back</button>

  <!-- Drop zone (shown when nothing loaded) -->
  <div class="player-drop-zone" *ngIf="!isLoaded && !isLoading" [class.drag-over]="isDragOver">
    <div class="player-drop-heading">Frogmarks Player</div>
    <div class="player-drop-sub">Drop a <code>.frogcart</code> file here to play it</div>
    <label class="player-btn player-file-btn">
      Choose file
      <input type="file" accept=".frogcart" style="display:none" (change)="onFileInput($event)">
    </label>
    <div class="player-error" *ngIf="errorMsg" role="alert">Couldn't play this file: {{ errorMsg }}</div>
  </div>

  <!-- Loading spinner (from the Shell: only when loading takes longer than SPINNER_DELAY_MS) -->
  <div class="player-loading" *ngIf="isLoading && spinnerVisible" role="status">
    <div class="player-loading-spinner"></div>
    <div class="player-loading-label">Loading…</div>
  </div>

</div>
